<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arc Swap</title>
<style>
  :root { --bg:#0b0f17; --card:#121826; --line:#1f2a3d; --text:#e6ebf5; --muted:#8a94a8; --accent:#22d3ee; --ok:#34d399; --err:#f87171; --btn:#2563eb; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; padding:24px 16px; }
  .wrap { max-width:460px; margin:0 auto; }
  header { display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; }
  h1 { font-size:18px; margin:0; letter-spacing:.02em; }
  h1 small { color:var(--muted); font-weight:400; margin-left:6px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; }
  .row { display:flex; gap:8px; }
  input, select { width:100%; background:#0e1420; border:1px solid var(--line); color:var(--text); border-radius:10px; padding:11px 12px; font-size:15px; outline:none; }
  input:focus, select:focus { border-color:var(--accent); }
  input[type=number] { -moz-appearance:textfield; appearance:textfield; }
  input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance:none; margin:0; }
  button { border:0; border-radius:10px; padding:11px 14px; font-size:15px; font-weight:600; cursor:pointer; color:#fff; background:var(--btn); }
  button:disabled { opacity:.45; cursor:not-allowed; }
  button.ghost { background:#0e1420; border:1px solid var(--line); color:var(--text); }
  button.connected { background:#0e1420; border:1px solid var(--ok); color:var(--ok); font-family:ui-monospace,monospace; }
  .seg { display:flex; background:#0e1420; border:1px solid var(--line); border-radius:10px; padding:3px; margin:14px 0 10px; }
  .seg button { flex:1; background:transparent; color:var(--muted); padding:8px; }
  .seg button.active { background:var(--btn); color:#fff; }
  label { display:block; font-size:12px; color:var(--muted); margin:10px 0 6px; text-transform:uppercase; letter-spacing:.06em; }
  .amt { position:relative; }
  .amt input { padding-right:96px; font-size:20px; }
  .amt .sym { position:absolute; right:52px; top:50%; transform:translateY(-50%); color:var(--muted); font-weight:600; }
  .amt .max { position:absolute; right:8px; top:50%; transform:translateY(-50%); padding:4px 8px; font-size:12px; background:#1b2436; }
  .hint { font-size:12px; color:var(--muted); margin-top:6px; display:flex; justify-content:space-between; }
  .quote { margin-top:12px; padding:12px; background:#0e1420; border-radius:10px; border:1px solid var(--line); }
  .quote .big { font-size:20px; font-weight:700; }
  .quote .sub { color:var(--muted); font-size:12px; }
  .pool { margin-top:12px; font-size:13px; color:var(--muted); }
  .pool b { color:var(--text); }
  .pool .mcap { color:var(--accent); font-weight:700; font-size:15px; margin:2px 0; }
  .pool code { font-size:11px; word-break:break-all; color:#5f6b82; }
  .status { margin-top:12px; font-size:13px; color:var(--muted); min-height:18px; }
  .status.ok { color:var(--ok); } .status.err { color:var(--err); }
  .swap { width:100%; margin-top:12px; padding:14px; font-size:16px; background:linear-gradient(90deg,#06b6d4,#2563eb); }
  .log { font-size:13px; padding:8px 0; border-top:1px solid var(--line); color:var(--muted); }
  .log.ok { color:var(--ok); } .log.err { color:var(--err); }
  .log a { color:var(--accent); }
  details, .adv { margin-top:14px; font-size:13px; color:var(--muted); }
  .adv label { margin-top:8px; }
  .adv input, .adv select { font-size:13px; padding:8px 10px; }
  .linkish { background:none; border:0; color:var(--muted); padding:0; font-size:13px; text-decoration:underline; cursor:pointer; }
  body.busy .swap { opacity:.6; }
  .pickbox { margin-bottom:14px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .pickbox[hidden] { display:none; }
  .pickbox .pick-title { width:100%; font-size:13px; color:var(--muted); }
  .pickbox .pick { display:flex; align-items:center; gap:8px; }
  .pickbox .pick img { width:20px; height:20px; border-radius:4px; }
  footer { margin-top:18px; font-size:12px; color:#5f6b82; text-align:center; }
  footer a { color:#5f6b82; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Arc Swap <small>o1 launchpad tokens · Uniswap v4</small></h1>
    <button id="connectBtn" class="ghost">Connect wallet</button>
  </header>

  <div id="walletPick" class="card pickbox" hidden></div>

  <div class="card">
    <label for="token">Token address</label>
    <div class="row">
      <input id="token" placeholder="0x… (the token contract on Arc)" spellcheck="false" autocomplete="off">
      <button id="findBtn" class="ghost">Find</button>
    </div>
    <div id="poolBox" class="pool" hidden>
      <div><b id="poolSymbol"></b> · <span id="poolPrice"></span></div>
      <div class="mcap" id="poolMcap"></div>
      <div><span id="poolFee"></span> · paired with <span id="poolQuoteKind"></span></div>
      <code id="poolId"></code>
    </div>

    <div class="seg">
      <button data-side="buy" class="active">Buy</button>
      <button data-side="sell">Sell</button>
    </div>

    <label for="amount">You pay</label>
    <div class="amt">
      <input id="amount" type="number" inputmode="decimal" min="0" step="any" placeholder="0.0">
      <span class="sym" id="inSym">USDC</span>
      <button id="maxBtn" class="max">MAX</button>
    </div>
    <div class="hint"><span id="inBal"></span><span id="gasBal"></span></div>

    <div id="quoteBox" class="quote" hidden>
      <div class="sub">You receive (<span id="outSym">TOKEN</span>)</div>
      <div class="big" id="quoteOut"></div>
      <div class="sub" id="quoteMin"></div>
    </div>

    <label for="slippage">Max slippage %</label>
    <input id="slippage" type="number" min="0" max="50" step="0.1" value="1">

    <button id="swapBtn" class="swap" disabled>Swap</button>
    <div id="status" class="status"></div>

    <button id="advToggle" class="linkish" style="margin-top:12px">Advanced</button>
    <div id="adv" class="adv" hidden>
      <label>Arc RPC URL (recommended: lets the page read revert reasons; also used to add Arc to the wallet)</label>
      <input id="rpcUrl" placeholder="https://rpc.arc-scan.org" spellcheck="false">
      <label>Scan from block (speeds up pool lookup; token launch block from Arcscan)</label>
      <input id="fromBlock" type="number" placeholder="e.g. 2100000">
      <label>Blocks per log request</label>
      <input id="logChunk" type="number" value="10000">
      <label>Manual pool (skips lookup) — hook address</label>
      <input id="hook" placeholder="0x…" spellcheck="false">
      <div class="row">
        <div style="flex:1"><label>Fee</label><input id="fee" type="number" placeholder="10000"></div>
        <div style="flex:1"><label>Tick spacing</label><input id="tickSpacing" type="number" placeholder="200"></div>
        <div style="flex:1"><label>USDC form</label><select id="quoteSel"><option value="erc20">ERC-20</option><option value="native">native</option></select></div>
      </div>
      <label>Hook data (leave 0x unless the launch requires it)</label>
      <input id="hookData" value="0x" spellcheck="false">
    </div>
  </div>

  <div id="log" style="margin-top:14px"></div>

  <footer>Trades go straight to the Uniswap v4 Universal Router on Arc (chain 5042). Gas is paid in USDC. Nothing leaves your browser except wallet requests.</footer>
</div>
<script>/*APP*/</script>
</body>
</html>
